{% extends "base.html" %}

{% block content %}
    <h2> Recipes: </h2>
    <p><a href="{% url 'ledger:recipe_add' %}">Add New Recipe</a></p>
    <ul>
        {% for recipe in recipes %}
            <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
