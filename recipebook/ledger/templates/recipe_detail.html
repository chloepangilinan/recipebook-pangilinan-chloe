{% extends "base.html" %}

{% block content %}
{% for item in recipe.images.all %}
    <img src="{{ item.image.url }}" alt="{{ item.description }}" style="max-block-size: 200px;">
{% endfor %}

<h2>{{ recipe.name }}</h2>
<h4>Created by: {{ recipe.author.name }}</h4>
<ul>
    {% for item in recipe.ingredients.all %}
        <li>{{ item.ingredient.name }}: {{ item.quantity }}</li>
    {% endfor %}
</ul>
<a href="{% url 'ledger:add_image' recipe.pk %}">Upload Image</a>
{% endblock %}
